name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Check the distribution names no assistant
        # The pattern is assembled rather than written out, so that this guard
        # does not itself put the names it forbids into the repository.
        run: |
          mkdir -p _check
          tar xzf dist/*.tar.gz -C _check
          pattern="$(printf '%s|%s|%s|%s' cla''ude open''ai copi''lot anthro''pic)"
          if grep -rniE "$pattern" _check/; then
            echo "the distribution names an assistant; see the project rules"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
