<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 264" width="880" height="264" role="img" aria-label="foldrunner">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2135"/>
      <stop offset="1" stop-color="#0f3527"/>
    </linearGradient>
    <linearGradient id="diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e5c38"/>
      <stop offset="1" stop-color="#1b7a4c"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="877" height="261" rx="18" fill="url(#card)" stroke="#20503c" stroke-width="1.5"/>

  <!-- icon: upper-triangular pair matrix. The diagonal is the self-pairs
       (homodimers); only the upper triangle is enumerated, N(N+1)/2 cells. -->
  <g transform="translate(52,66)">
    <rect x="10" y="-13" width="130" height="7" rx="3.5" fill="#4EA6DC"/>
    <rect x="-13" y="10" width="7" height="130" rx="3.5" fill="#E69F00"/>

    <!-- diagonal: self-pairs -->
    <rect x="10"  y="10"  width="30" height="30" rx="5" fill="url(#diag)"/>
    <rect x="43"  y="43"  width="30" height="30" rx="5" fill="url(#diag)"/>
    <rect x="76"  y="76"  width="30" height="30" rx="5" fill="url(#diag)"/>
    <rect x="109" y="109" width="30" height="30" rx="5" fill="url(#diag)"/>

    <!-- upper triangle: hetero pairs -->
    <rect x="43"  y="10"  width="30" height="30" rx="5" fill="#9ed4b5"/>
    <rect x="76"  y="10"  width="30" height="30" rx="5" fill="#bfe4cc"/>
    <rect x="109" y="10"  width="30" height="30" rx="5" fill="#d9f2e2"/>
    <rect x="76"  y="43"  width="30" height="30" rx="5" fill="#8fcaa8"/>
    <rect x="109" y="43"  width="30" height="30" rx="5" fill="#b3dfc3"/>
    <rect x="109" y="76"  width="30" height="30" rx="5" fill="#cdeeda"/>

    <!-- lower triangle: the mirror image, never enumerated twice -->
    <g fill="none" stroke="#2b5c46" stroke-width="1.2" stroke-dasharray="3 3">
      <rect x="10"  y="43"  width="30" height="30" rx="5"/>
      <rect x="10"  y="76"  width="30" height="30" rx="5"/>
      <rect x="10"  y="109" width="30" height="30" rx="5"/>
      <rect x="43"  y="76"  width="30" height="30" rx="5"/>
      <rect x="43"  y="109" width="30" height="30" rx="5"/>
      <rect x="76"  y="109" width="30" height="30" rx="5"/>
    </g>

    <circle cx="25"  cy="25"  r="4.5" fill="#D55E00" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="91"  cy="91"  r="4.5" fill="#D55E00" stroke="#ffffff" stroke-width="1.4"/>
  </g>

  <!-- wordmark -->
  <text x="218" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#F4F7F5" letter-spacing="-1">fold<tspan fill="#7BD8A8">runner</tspan></text>

  <!-- tagline -->
  <text x="220" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" fill="#BACDC4">All-vs-all panels · one alignment per sequence · write and run</text>
  <text x="220" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" fill="#7E968B">AlphaFold3&#160;·&#160;AF&#160;Server&#160;·&#160;Boltz-2&#160;·&#160;Protenix&#160;·&#160;Chai-1&#160;·&#160;ColabFold&#160;·&#160;AF2&#160;·&#160;SeedFold</text>

  <!-- command pills -->
  <rect x="219" y="163" width="440" height="33" rx="9" fill="#0a1522" stroke="#27513e"/>
  <text x="235" y="185" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="14.5" fill="#8FE3B0">$ frx write library.fasta <tspan fill="#6DA3D8">-o</tspan> panel/ <tspan fill="#6DA3D8">--cache</tspan> msa/</text>
  <rect x="219" y="203" width="440" height="33" rx="9" fill="#0a1522" stroke="#27513e"/>
  <text x="235" y="225" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="14.5" fill="#8FE3B0">$ frx run panel/ <tspan fill="#6DA3D8">-o</tspan> results/</text>

  <!-- feature chips -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">
    <rect x="706" y="41"  width="128" height="30" rx="15" fill="#009E73"/>
    <text x="770" y="61"  fill="#ffffff">all-vs-all</text>
    <rect x="706" y="79"  width="128" height="30" rx="15" fill="#D55E00"/>
    <text x="770" y="99"  fill="#ffffff">MSA reuse</text>
    <rect x="706" y="117" width="128" height="30" rx="15" fill="#E69F00"/>
    <text x="770" y="137" fill="#ffffff">8 engines</text>
    <rect x="706" y="155" width="128" height="30" rx="15" fill="#4EA6DC"/>
    <text x="770" y="175" fill="#ffffff">write · run</text>
    <rect x="706" y="193" width="128" height="30" rx="15" fill="#0072B2"/>
    <text x="770" y="213" fill="#ffffff">resumable</text>
  </g>
</svg>
