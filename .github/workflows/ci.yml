name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Without this the matrix version is never applied: uv would install
          # into whichever interpreter the runner happens to ship, and the four
          # jobs would all test the same one.
          python-version: ${{ matrix.python-version }}

      - name: Install
        # uv refuses to install outside an environment, and the runner has none.
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Show what is being tested
        run: |
          uv run python -V
          uv run python -c "import foldrunner; print('foldrunner', foldrunner.__version__)"

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q
